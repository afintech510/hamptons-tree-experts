# Hamptons Tree Experts — Nginx reverse proxy
# Routes money endpoints + Stripe webhook DIRECT to FastAPI (R-18).
# /var/hte/uploads is NEVER served statically (R-11) — photos are
# streamed only through the authenticated API endpoint.

upstream api_backend {
    server hte_api:8000;
}

upstream web_frontend {
    server hte_web:3000;
}

server {
    listen 80;
    server_name hamptonstreeexperts.com www.hamptonstreeexperts.com;

    client_max_body_size 15M;

    # --- MONEY ENDPOINTS: route DIRECT to FastAPI (R-18) ---
    # These must NOT pass through the Next.js proxy so the raw request
    # body reaches Stripe signature verification untouched and rate-limit
    # defenses key off the true client IP.

    # Stripe webhook
    location = /api/v1/webhooks/stripe {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # BIN checkout
    location = /api/v1/orders/bin {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Estimate submission (multipart with photos)
    location = /api/v1/estimates {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Plant authorize-confirm
    location = /api/v1/orders/authorize-confirm {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All admin API endpoints
    location /api/v1/admin/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- OTHER API ENDPOINTS: also to FastAPI ---
    # Pricing, order lookup, services catalog, health
    location /api/v1/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check (direct to API)
    location = /health {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # --- SECURITY: /var/hte/uploads is NEVER served statically (R-11) ---
    # Photos are served ONLY through the JWT-authenticated admin endpoint
    # GET /api/v1/admin/estimates/{id}/photos/{n}. No location block exposes
    # the uploads directory. Do NOT add one.

    # --- FRONTEND: everything else to Next.js ---
    location / {
        proxy_pass http://web_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
