# hamptonstreeexperts.com -> hte_nginx:80
# Add this server block to host-hampton-ops/nginx/nginx.conf on the VPS.
# Cloudflare handles public SSL; this terminates the Cloudflare origin cert.

server {
    listen 80;
    server_name hamptonstreeexperts.com www.hamptonstreeexperts.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name hamptonstreeexperts.com www.hamptonstreeexperts.com;

    ssl_certificate     /etc/ssl/benchworksai/origin.pem;
    ssl_certificate_key /etc/ssl/benchworksai/origin-key.pem;

    resolver 127.0.0.11 valid=30s;
    set $upstream http://hte_nginx:80;

    location / {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
